# Builds, CODE-SIGNS and checks the Windows app (Electron, x64) for CropDog, on
# GitHub's free Windows runners for public repos. The source is the PRIVATE
# seenu-artona/crop-dog repo, checked out here with a read-only deploy key
# (secret CROPDOG_DEPLOY_KEY); nothing of it lives in this repo. Run BY HAND
# only, giving the version number. This is crop-dog's .github/workflows/
# windows-app.yml (commit de5c786) with the checkout changed, plus three jobs
# after the build: the real update swap, the installer (install / launch / swap
# inside the installed folder / uninstall), and the five-photo box check.
#
# FIVE JOBS.
#   build-app    — builds, signs CropDog.exe, builds the per-user INSTALLER
#                  (CropDog-Setup-<v>.exe, electron-builder NSIS from the same
#                  packaged folder; its uninstaller and the installer are signed
#                  by the same profile through a sign hook), verifies both
#                  signatures with signtool, zips, and keeps zip + Setup + .json
#                  as a workflow ARTIFACT (7 days). With `publish: true` it ALSO
#                  publishes them as the pre-release desktop-v<version>-win in
#                  seenu-artona/cropdog-releases (needs the RELEASES_TOKEN secret
#                  in THIS repo). It never touches manifest.json: nothing reaches
#                  a studio until manifest.latestWin is written from the Mac
#                  (crop-dog's desktop/RELEASING.md). Without the secret, publish
#                  from the Mac with the downloaded artifact (RELEASING.md).
#   swap-test    — the SHIPPED Windows app (manifest.latestWin) is replaced in
#                  place by this build by the REAL swap.ps1, launched the way
#                  updater.js launches it (.github/scripts/swap-real-test.mjs).
#   install-test — the installer, as a studio meets it: a fresh install as a
#                  NON-ADMIN local user (silent), the files, both shortcuts and
#                  the Add/Remove entry in place and no elevation; the app
#                  launched from an installed copy; the real swap.ps1 run INSIDE
#                  an installed folder (down to the shipped version, back up to
#                  this one: the uninstaller survives, Add/Remove shows the new
#                  version); then uninstall, leaving no files, shortcuts or entry.
#   fallback-test — the automatic GPU -> processor switch (crop-dog 1.2.26+), forced
#                  twice (helper dies on start; dies on the first photo): all five
#                  photos parsed on the processor, boxes identical to the Mac's.
#   box-check    — the five standard photos (a PRIVATE branch of crop-dog, fetched
#                  at run time with the same deploy key; NEVER in this repo, NEVER
#                  uploaded as an artifact) are parsed on the Windows CPU runtime
#                  (fp32) and cropped by the same engine the app ships; the boxes
#                  must equal the Mac's (native/detect/golden/five-boxes-mac.json).
#                  Only the box numbers leave the runner, in the job summary.
#
# CODE SIGNING — Azure Artifact Signing (Microsoft's name since 2026 for Trusted
# Signing), configured in crop-dog's desktop/winsign.json and read by its
# desktop/scripts/winsign.mjs. With a certificate profile there (since
# 2026-10-27: cropdog-public), build.mjs signs CropDog.exe with Microsoft's
# PowerShell cmdlet (Invoke-ArtifactSigning: the same call electron-builder's
# azureSignOptions makes), then verifies the signature is Valid, timestamped and
# by the configured publisher; electron-builder's sign hook does the same for
# the uninstaller and the installer; this job then re-verifies both files with
# the Windows SDK's signtool. A build that fails any of those never reaches the
# artifact or the publish step, so there is no silently unsigned build. (With no
# profile in winsign.json the build is UNSIGNED and says so; the Azure steps are
# skipped.)
#
# HOW IT AUTHENTICATES — no secret. `azure/login` exchanges this job's GitHub
# OIDC token for an Azure sign-in through a FEDERATED CREDENTIAL on the Entra
# app registration "cropdog-builder" (issuer token.actions.githubusercontent.com,
# subject repo:seenu-artona@292234898/cropdog-builder@1436242924:ref:refs/heads/main
# — the id-qualified form GitHub presents; the plain one is refused — so this
# workflow signs only when run from `main` of THIS repo). The signing cmdlet then
# finds that sign-in by itself (Azure's DefaultAzureCredential chain, its
# AzureCliCredential step). The three values azure/login needs — tenant id,
# client id, subscription id — are identifiers, kept as this repo's Actions
# VARIABLES (AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_SUBSCRIPTION_ID), not
# secrets. The app registration has NO client secret. `id-token: write` lets the
# job mint the OIDC token; it grants nothing else.
name: Windows app

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 1.2.25 (X.Y.Z)"
        required: true
        type: string
      ref:
        description: "crop-dog branch or commit to build"
        required: false
        default: unified
        type: string
      publish:
        description: "Also publish the pre-release desktop-v<version>-win to cropdog-releases (needs RELEASES_TOKEN here)"
        required: false
        default: false
        type: boolean
      artifact_run:
        description: "Skip the build: run the checks against the CropDog-<version>-win artifact of this earlier run id"
        required: false
        default: ""
        type: string
      live_repeat:
        description: "Live timing: copies of each of the five photos per run (40 = 200 photos)"
        required: false
        default: "40"
        type: string
      live_timing:
        description: "Also time the live cropping view on vs off (release / off / off2 / plain / on, the five photos x40 in the real app, on the processor; three runners, ~3 h)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
  actions: read     # the check jobs may download an earlier run's artifact (artifact_run)

jobs:
  build-app:
    if: inputs.artifact_run == ''
    runs-on: windows-latest
    steps:
      - name: Check out crop-dog (private, read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: seenu-artona/crop-dog
          ref: ${{ inputs.ref || 'unified' }}
          ssh-key: ${{ secrets.CROPDOG_DEPLOY_KEY }}
          persist-credentials: false

      - name: Which commit
        shell: pwsh
        run: |
          "crop-dog: $(git log -1 --format='%H %s')" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if (git status --porcelain) { Write-Output "::error::checkout is not clean"; exit 1 }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (repo)
        run: npm ci

      - name: Install dependencies (desktop)
        run: npm ci
        working-directory: desktop

      # The one reader of desktop/winsign.json decides, so the workflow, build.mjs
      # and release.mjs cannot disagree about whether this build signs.
      - name: Read the code-signing configuration
        id: sign
        shell: pwsh
        run: |
          $cfg = node -e "import('./desktop/scripts/winsign.mjs').then(m => { const c = m.readWinSign('desktop/winsign.json'); console.log(JSON.stringify({ configured: c.configured, why: c.why || '', account: c.account, profile: c.profile || '', module: m.MODULE })) })"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $c = $cfg | ConvertFrom-Json
          if ($c.configured) {
            Write-Output "signing: Azure Artifact Signing, account $($c.account), profile $($c.profile)"
          } else {
            Write-Output "::warning title=Unsigned Windows build::$($c.why)"
            Write-Output $c.why
          }
          "configured=$($c.configured.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "module=$($c.module.name)"                            | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "module_version=$($c.module.version)"                 | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # ── Signing only (skipped when no profile is configured) ────────────────
      - name: Check the Azure identifiers are set (variables, not secrets)
        if: steps.sign.outputs.configured == 'true'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          $missing = @("AZURE_TENANT_ID", "AZURE_CLIENT_ID", "AZURE_SUBSCRIPTION_ID") | Where-Object { [string]::IsNullOrWhiteSpace((Get-Item "env:$_" -ErrorAction SilentlyContinue).Value) }
          if ($missing) {
            Write-Output "::error::Signing is configured (desktop/winsign.json) but these repository VARIABLES are not set: $($missing -join ', '). Set them under Settings > Secrets and variables > Actions > Variables (they are identifiers, not secrets). See crop-dog's desktop/RELEASING.md."
            exit 1
          }

      - name: Sign in to Azure with this job's OIDC token (no client secret)
        if: steps.sign.outputs.configured == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Microsoft's signing module (pinned)
        if: steps.sign.outputs.configured == 'true'
        shell: pwsh
        run: |
          Install-Module -Name "${{ steps.sign.outputs.module }}" -RequiredVersion "${{ steps.sign.outputs.module_version }}" -Repository PSGallery -Scope CurrentUser -Force
          Get-Module -ListAvailable -Name "${{ steps.sign.outputs.module }}" | Format-Table Name, Version
      # ────────────────────────────────────────────────────────────────────────

      - name: Build the Windows app (web build, package, sign if configured, zip, installer, bundle check)
        run: node desktop/scripts/build.mjs --target win --version ${{ inputs.version }}

      # A second, independent verification of the signatures build.mjs already
      # checked — with signtool itself, the tool Windows ships for exactly this,
      # on BOTH files a studio runs: the app exe and the installer.
      # /pa: the default Authenticode policy (what SmartScreen and Explorer apply).
      - name: Verify both signatures with signtool
        if: steps.sign.outputs.configured == 'true'
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { Write-Output "::error::signtool.exe not found in the Windows SDK on this runner"; exit 1 }
          $meta = Get-Content "desktop/dist/CropDog-${{ inputs.version }}-win.json" | ConvertFrom-Json
          if (-not $meta.signed) { Write-Output "::error::build.mjs recorded the app as UNSIGNED although signing is configured"; exit 1 }
          if (-not $meta.installer.signed) { Write-Output "::error::build.mjs recorded the installer as UNSIGNED although signing is configured"; exit 1 }
          foreach ($f in @("desktop/build/packaged/CropDog-win32-x64/CropDog.exe", "desktop/dist/$($meta.installer.file)")) {
            & $signtool.FullName verify /pa /v $f 2>&1 | Tee-Object -Variable out
            if ($LASTEXITCODE -ne 0) { Write-Output "::error::signtool verify failed on $f"; exit $LASTEXITCODE }
            $s = Get-AuthenticodeSignature -LiteralPath $f
            if ($s.Status -ne 'Valid') { Write-Output "::error::Get-AuthenticodeSignature on ${f}: $($s.Status) $($s.StatusMessage)"; exit 1 }
            "signtool verify /pa /v $(Split-Path -Leaf $f): OK" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            ($out | Where-Object { $_ -match 'Issued to:|The signature is timestamped:|Successfully verified' } | Select-Object -Last 3) | ForEach-Object { "    $_" } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Size, sha256 and signature
        shell: pwsh
        run: |
          $meta = Get-Content "desktop/dist/CropDog-${{ inputs.version }}-win.json" | ConvertFrom-Json
          "zip:       $($meta.file)"   | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "size:      $($meta.size)"   | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "sha256:    $($meta.sha256)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $sig = if ($meta.signed) { "signed by $($meta.signer)" } else { "UNSIGNED (no certificate profile in desktop/winsign.json)" }
          "signed:    $sig"            | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "installer: $($meta.installer.file)  size $($meta.installer.size)  sha256 $($meta.installer.sha256)  $(if ($meta.installer.signed) { 'signed by ' + $meta.installer.signer } else { 'UNSIGNED' })" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      # The zip, the installer and the .json, for the check jobs below and for
      # publishing from the Mac. 7 days is plenty: a build that is not released
      # within a week is rebuilt from the then-current commit anyway.
      - name: Keep the build as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: CropDog-${{ inputs.version }}-win
          path: |
            desktop/dist/CropDog-${{ inputs.version }}-win-x64.zip
            desktop/dist/CropDog-Setup-${{ inputs.version }}.exe
            desktop/dist/CropDog-${{ inputs.version }}-win.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish the pre-release to the releases repo
        if: inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            Write-Output "::error::publish was requested but the RELEASES_TOKEN secret is not set in this repo. Either set it (a fine-grained token scoped to seenu-artona/cropdog-releases, Contents read/write) or publish from the Mac with the artifact (crop-dog's desktop/RELEASING.md)."
            exit 1
          }
          # We check $LASTEXITCODE ourselves: `gh release view` on a tag that does
          # not exist exits non-zero, and here that is the NORMAL path, not a
          # failure — so do not let a non-zero native exit throw the step.
          $PSNativeCommandUseErrorActionPreference = $false

          $repo  = "seenu-artona/cropdog-releases"
          $tag   = "desktop-v${{ inputs.version }}-win"
          $zip   = "desktop/dist/CropDog-${{ inputs.version }}-win-x64.zip"
          $setup = "desktop/dist/CropDog-Setup-${{ inputs.version }}.exe"
          $json  = "desktop/dist/CropDog-${{ inputs.version }}-win.json"
          $meta  = Get-Content $json | ConvertFrom-Json
          $sig   = if ($meta.signed) { "Signed by $($meta.signer)." } else { "Unsigned build." }

          # NEVER overwrite a build users may already be updating from. If the tag
          # is already in the releases repo, stop the job here — do not clobber it.
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "::error::Release $tag already exists in $repo — refusing to overwrite it."
            exit 1
          }

          # A pre-release, like the existing Windows entries. It attaches the zip,
          # the installer and the .json metadata, and does NOT touch manifest.json.
          $url = gh release create $tag $zip $setup $json `
            --repo $repo `
            --prerelease `
            --title $tag `
            --notes "Windows build for CropDog ${{ inputs.version }}. $sig Not live for users until manifest.latestWin is updated separately (desktop/RELEASING.md)."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "url:    $url" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

  # ── The real update swap: the shipped version -> this build (zip install) ──
  swap-test:
    needs: build-app
    if: always() && (needs.build-app.result == 'success' || inputs.artifact_run != '')
    runs-on: windows-latest
    steps:
      - name: Check out crop-dog (for swap.ps1 and the test script)
        uses: actions/checkout@v4
        with:
          repository: seenu-artona/crop-dog
          ref: ${{ inputs.ref || 'unified' }}
          ssh-key: ${{ secrets.CROPDOG_DEPLOY_KEY }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch this build (this run's artifact)
        if: inputs.artifact_run == ''
        uses: actions/download-artifact@v4
        with:
          name: CropDog-${{ inputs.version }}-win
          path: new

      - name: Fetch the build (an earlier run's artifact)
        if: inputs.artifact_run != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ inputs.artifact_run }} --repo ${{ github.repository }} -n CropDog-${{ inputs.version }}-win -D new

      # Whether this build is signed, from its own sidecar (build.mjs wrote it).
      - name: Read the build's sidecar
        id: build
        shell: pwsh
        run: |
          $meta = Get-Content "new/CropDog-${{ inputs.version }}-win.json" | ConvertFrom-Json
          "build: crop-dog $($meta.commit) signed=$($meta.signed) installer=$($meta.installer.file)"
          "signed=$(([bool]$meta.signed).ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # The version studios are on: whatever manifest.latestWin points at, fetched
      # and sha256-checked exactly as the app's updater would (the releases repo
      # is public; the job's own token reads it).
      - name: Fetch the shipped Windows app (manifest.latestWin)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $m = (gh api repos/seenu-artona/cropdog-releases/contents/manifest.json -H "Accept: application/vnd.github.raw" | ConvertFrom-Json).latestWin
          "shipped Windows version: $($m.version) ($($m.url))" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          New-Item -ItemType Directory -Force -Path old | Out-Null
          Invoke-WebRequest -Uri $m.url -OutFile old/shipped.zip
          $got = (Get-FileHash -Algorithm SHA256 old/shipped.zip).Hash.ToLower()
          if ($got -ne $m.sha256) { throw "shipped zip sha256 $got != manifest $($m.sha256)" }
          if ((Get-Item old/shipped.zip).Length -ne $m.size) { throw "shipped zip size mismatch" }
          Expand-Archive -Path old/shipped.zip -DestinationPath old/app -Force
          Expand-Archive -Path "new/CropDog-${{ inputs.version }}-win-x64.zip" -DestinationPath new/app -Force
          Remove-Item old/shipped.zip -Force

      - name: Run the REAL swap.ps1, as updater.js launches it, from the shipped version to this build
        shell: pwsh
        run: |
          node .github/scripts/swap-real-test.mjs old/app new/app ${{ inputs.version }} 2>&1 | Tee-Object -Variable out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ($out | Select-Object -Last 1) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: The installed exe after the swap is this build's signed one
        if: steps.build.outputs.signed == 'true'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path old/app -Recurse -Filter CropDog.exe | Select-Object -First 1
          $s = Get-AuthenticodeSignature -LiteralPath $exe.FullName
          "after the swap: $($exe.FullName) signature $($s.Status), signer $($s.SignerCertificate.Subject)"
          if ($s.Status -ne 'Valid') { Write-Output "::error::the swapped-in CropDog.exe is not validly signed: $($s.Status)"; exit 1 }
          "swapped-in CropDog.exe: signature Valid, $($s.SignerCertificate.Subject)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

  # ── The installer, as a studio meets it ───────────────────────────────────
  install-test:
    needs: build-app
    if: always() && (needs.build-app.result == 'success' || inputs.artifact_run != '')
    runs-on: windows-latest
    env:
      ARP: 'Software\Microsoft\Windows\CurrentVersion\Uninstall\bbaad8a5-704e-4315-b7e7-d2d472f2a539'   # pinned in desktop/electron-builder.yml
    steps:
      - name: Check out crop-dog (for swap.ps1 and the test script)
        uses: actions/checkout@v4
        with:
          repository: seenu-artona/crop-dog
          ref: ${{ inputs.ref || 'unified' }}
          ssh-key: ${{ secrets.CROPDOG_DEPLOY_KEY }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch this build (this run's artifact)
        if: inputs.artifact_run == ''
        uses: actions/download-artifact@v4
        with:
          name: CropDog-${{ inputs.version }}-win
          path: new

      - name: Fetch the build (an earlier run's artifact)
        if: inputs.artifact_run != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ inputs.artifact_run }} --repo ${{ github.repository }} -n CropDog-${{ inputs.version }}-win -D new

      # Whether this build is signed, from its own sidecar (build.mjs wrote it).
      - name: Read the build's sidecar
        id: build
        shell: pwsh
        run: |
          $meta = Get-Content "new/CropDog-${{ inputs.version }}-win.json" | ConvertFrom-Json
          "build: crop-dog $($meta.commit) signed=$($meta.signed) installer=$($meta.installer.file)"
          "signed=$(([bool]$meta.signed).ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # This job's own account first (an interactive session): a silent install,
      # the files, both shortcuts and the Add/Remove entry, then the app launched
      # from the installed copy.
      - name: Install for this account (silent) and launch the app from the installed copy
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = (Resolve-Path "new/CropDog-Setup-${{ inputs.version }}.exe").Path
          $t0 = Get-Date
          $p = Start-Process -FilePath $setup -ArgumentList "/S" -Wait -PassThru
          "installer exit code: $($p.ExitCode) after $([int]((Get-Date) - $t0).TotalSeconds) s"
          if ($p.ExitCode -ne 0) { throw "the installer exited $($p.ExitCode)" }
          $dir = "$env:LOCALAPPDATA\Programs\CropDog"
          foreach ($f in @("$dir\CropDog.exe", "$dir\Uninstall CropDog.exe", "$dir\resources\app\package.json",
                           "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\CropDog.lnk", "$env:USERPROFILE\Desktop\CropDog.lnk")) {
            if (-not (Test-Path -LiteralPath $f)) {
              "CropDog.exe files on disk:"; Get-ChildItem -Path C:\Users -Recurse -Filter CropDog.exe -ErrorAction SilentlyContinue | ForEach-Object { "  " + $_.FullName }
              throw "missing after install: $f"
            }
            "present: $f"
          }
          $v = (Get-Content "$dir\resources\app\package.json" | ConvertFrom-Json).version
          if ($v -ne "${{ inputs.version }}") { throw "installed version is $v" }
          $dv = (Get-ItemProperty -Path "HKCU:\$env:ARP").DisplayVersion
          if ($dv -ne "${{ inputs.version }}") { throw "Add/Remove Programs DisplayVersion is '$dv'" }
          foreach ($bad in @("$env:ProgramFiles\CropDog", "${env:ProgramFiles(x86)}\CropDog", "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\CropDog.lnk")) {
            if (Test-Path -LiteralPath $bad) { throw "the per-user installer wrote a machine-wide location: $bad" }
          }
          if (Test-Path "HKLM:\$env:ARP") { throw "the per-user installer wrote an HKLM uninstall entry" }
          $s = Get-AuthenticodeSignature -LiteralPath "$dir\Uninstall CropDog.exe"
          "uninstaller signature: $($s.Status) $($s.SignerCertificate.Subject)"
          if ("${{ steps.build.outputs.signed }}" -eq "true" -and $s.Status -ne "Valid") { throw "the installed uninstaller is not validly signed" }
          "install (this account): files, Start-menu + desktop shortcuts, Add/Remove entry ${{ inputs.version }}, nothing machine-wide, uninstaller signed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $app = Start-Process -FilePath "$dir\CropDog.exe" -PassThru -WorkingDirectory $dir
          Start-Sleep -Seconds 20
          $alive = Get-Process -Id $app.Id -ErrorAction SilentlyContinue
          # A healthy launch writes network.log (the manifest GET at startup) in the
          # app's data folder; startup.log exists ONLY when startup failed (main.js
          # writes it from its error handler), so its presence is the failure.
          $net = "$env:APPDATA\CropDog\network.log"
          $fail = "$env:APPDATA\CropDog\startup.log"
          "process alive after 20 s: $([bool]$alive); network.log present: $(Test-Path $net); startup.log (failure) present: $(Test-Path $fail)"
          if (Test-Path $fail) { Get-Content $fail | Select-Object -First 20; throw "the app recorded a startup failure" }
          if (Test-Path $net) { Get-Content $net | Select-Object -First 6 }
          if (-not $alive) { throw "CropDog.exe did not stay running" }
          if (-not (Test-Path $net)) { throw "the app wrote no network.log — it did not reach its startup manifest check" }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Get-Process -Name CropDog -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          "launched from the installed copy: process ran 20 s, network.log written, no startup failure" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      # The in-app update, INSIDE an installed folder: down to the shipped version
      # (the zip studios are on), then back up to this build — both with the real
      # swap.ps1 as updater.js launches it. The uninstaller must survive both and
      # Add/Remove Programs must show the swapped-in version each time.
      - name: Swap inside the installed folder — to the shipped version and back to this build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $dir = "$env:LOCALAPPDATA\Programs\CropDog"
          $m = (gh api repos/seenu-artona/cropdog-releases/contents/manifest.json -H "Accept: application/vnd.github.raw" | ConvertFrom-Json).latestWin
          New-Item -ItemType Directory -Force -Path old | Out-Null
          Invoke-WebRequest -Uri $m.url -OutFile old/shipped.zip
          if ((Get-FileHash -Algorithm SHA256 old/shipped.zip).Hash.ToLower() -ne $m.sha256) { throw "shipped zip sha256 mismatch" }
          Expand-Archive -Path old/shipped.zip -DestinationPath old/app -Force
          Expand-Archive -Path "new/CropDog-${{ inputs.version }}-win-x64.zip" -DestinationPath new/app -Force
          $ErrorActionPreference = "Continue"
          "=== swap installed ${{ inputs.version }} -> shipped $($m.version)"
          node .github/scripts/swap-real-test.mjs $dir old/app $m.version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dv = (Get-ItemProperty -Path "HKCU:\$env:ARP").DisplayVersion
          if ($dv -ne $m.version) { Write-Output "::error::Add/Remove Programs shows $dv after swapping to $($m.version)"; exit 1 }
          "=== swap installed $($m.version) -> this build ${{ inputs.version }}"
          node .github/scripts/swap-real-test.mjs $dir new/app ${{ inputs.version }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dv = (Get-ItemProperty -Path "HKCU:\$env:ARP").DisplayVersion
          if ($dv -ne "${{ inputs.version }}") { Write-Output "::error::Add/Remove Programs shows $dv after swapping to ${{ inputs.version }}"; exit 1 }
          if (-not (Test-Path -LiteralPath "$dir\Uninstall CropDog.exe")) { Write-Output "::error::the uninstaller did not survive the swaps"; exit 1 }
          "swap inside the installed folder: ${{ inputs.version }} -> $($m.version) -> ${{ inputs.version }}; uninstaller kept; Add/Remove shows ${{ inputs.version }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Uninstall (this account) and check nothing is left
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = "$env:LOCALAPPDATA\Programs\CropDog"
          $p = Start-Process -FilePath "$dir\Uninstall CropDog.exe" -ArgumentList "/S" -Wait -PassThru -WorkingDirectory $env:RUNNER_TEMP
          "uninstaller exit code: $($p.ExitCode)"
          Start-Sleep -Seconds 5
          foreach ($f in @($dir, "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\CropDog.lnk", "$env:USERPROFILE\Desktop\CropDog.lnk")) {
            if (Test-Path -LiteralPath $f) { throw "left behind after uninstall: $f" }
          }
          if (Test-Path "HKCU:\$env:ARP") { throw "the Add/Remove Programs entry was left behind" }
          "uninstall (this account): install folder, both shortcuts and the Add/Remove entry are gone (user data in %APPDATA%\CropDog kept by design)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      # A STANDARD user (Users group only, never Administrators) with a random
      # password that is never printed. The installer must need no elevation: the
      # files land in that user's own %LocalAppData%\Programs. Launched with
      # CreateProcessWithLogonW (Start-Process -Credential) and that user's own
      # environment (see the note in the step).
      - name: Fresh install as a non-admin user (silent), check, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $user = "cropdogtest"
          $plain = [guid]::NewGuid().ToString() + "Aa1!"
          $pw = ConvertTo-SecureString $plain -AsPlainText -Force
          New-LocalUser -Name $user -Password $pw -PasswordNeverExpires -AccountNeverExpires | Out-Null
          Add-LocalGroupMember -Group "Users" -Member $user
          if ((Get-LocalGroupMember -Group "Administrators").Name -match "\\$user$") { throw "$user must not be an administrator" }
          $cred = New-Object System.Management.Automation.PSCredential($user, $pw)
          $setup = (Resolve-Path "new/CropDog-Setup-${{ inputs.version }}.exe").Path
          $T = $env:RUNNER_TEMP
          # What that user's token and environment look like.
          Start-Process -FilePath "$env:SystemRoot\System32\cmd.exe" -ArgumentList "/c whoami /groups & echo LOCALAPPDATA=%LOCALAPPDATA% & echo TEMP=%TEMP%" -Credential $cred -LoadUserProfile -Wait -RedirectStandardOutput "$T\who.txt" -WorkingDirectory $T
          Get-Content "$T\who.txt" | Where-Object { $_ -match "Administrators|Users|LOCALAPPDATA|TEMP|Mandatory" }
          $sid = (Get-LocalUser -Name $user).SID.Value
          $home2 = (Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$sid" -ErrorAction SilentlyContinue).ProfileImagePath
          "profile of ${user}: $home2"
          $dir = "$home2\AppData\Local\Programs\CropDog"
          # CreateProcessWithLogonW gives the child the user's TOKEN but the CALLER's
          # environment block, and Windows resolves the user's shell folders through
          # %USERPROFILE% from that block — so without this the installer aims at
          # runneradmin's folder (no write access) and fails silently with exit 0
          # (builder run 40597856700). A real logon sets these itself; set them here.
          $envp = "set USERPROFILE=$home2&& set HOMEDRIVE=C:&& set HOMEPATH=$($home2.Substring(2))&& set USERNAME=$user&& set APPDATA=$home2\AppData\Roaming&& set LOCALAPPDATA=$home2\AppData\Local&& set TEMP=$home2\AppData\Local\Temp&& set TMP=$home2\AppData\Local\Temp&& "
          New-Item -ItemType Directory -Force -Path "$home2\AppData\Local\Temp" | Out-Null
          Start-Process -FilePath "$env:SystemRoot\System32\cmd.exe" -ArgumentList "/c $envp echo LOCALAPPDATA=%LOCALAPPDATA%" -Credential $cred -LoadUserProfile -Wait -RedirectStandardOutput "$T\env.txt" -WorkingDirectory $T
          "as ${user} with its own environment: $(Get-Content "$T\env.txt" -Raw)"
          $t0 = Get-Date
          $p = Start-Process -FilePath "$env:SystemRoot\System32\cmd.exe" -ArgumentList "/c $envp `"$setup`" /S & echo installer-exit=%ERRORLEVEL%" -Credential $cred -LoadUserProfile -Wait -PassThru -RedirectStandardOutput "$T\inst1.txt" -RedirectStandardError "$T\inst1.err" -WorkingDirectory $T
          "installer as ${user}: cmd exit $($p.ExitCode) after $([int]((Get-Date) - $t0).TotalSeconds) s; $(Get-Content "$T\inst1.txt" -Raw) $(Get-Content "$T\inst1.err" -Raw)"
          $installed = Test-Path -LiteralPath "$dir\CropDog.exe"
          if (-not $installed) {
            "nothing at $dir; CropDog.exe anywhere under C:\Users:"
            Get-ChildItem -Path C:\Users -Recurse -Filter CropDog.exe -ErrorAction SilentlyContinue | ForEach-Object { "  " + $_.FullName }
          }
          if (-not $installed) { throw "the installer did not install for the non-admin user ${user}" }
          foreach ($f in @("$dir\CropDog.exe", "$dir\Uninstall CropDog.exe",
                           "$home2\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\CropDog.lnk", "$home2\Desktop\CropDog.lnk")) {
            if (-not (Test-Path -LiteralPath $f)) { throw "missing after install (${user}): $f" }
            "present: $f"
          }
          $v = (Get-Content "$dir\resources\app\package.json" | ConvertFrom-Json).version
          if ($v -ne "${{ inputs.version }}") { throw "installed version is $v" }
          # The Add/Remove entry lives in THAT user's HKCU: read it as them.
          Start-Process -FilePath "$env:SystemRoot\System32\reg.exe" -ArgumentList @("query", "HKCU\$env:ARP", "/v", "DisplayVersion") -Credential $cred -LoadUserProfile -Wait -RedirectStandardOutput "$T\arp.txt" -WorkingDirectory $T
          $arp = Get-Content "$T\arp.txt" -Raw
          if ($arp -notmatch "DisplayVersion\s+REG_SZ\s+${{ inputs.version }}") { throw "Add/Remove Programs entry missing or wrong for ${user}: $arp" }
          "Add/Remove Programs (as ${user}): DisplayVersion ${{ inputs.version }}"
          if (Test-Path "HKLM:\$env:ARP") { throw "the per-user installer wrote an HKLM uninstall entry" }
          "fresh install as non-admin ${user}: files, Start-menu + desktop shortcuts, Add/Remove entry ${{ inputs.version }}, no elevation" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          # Uninstall as that user, the same way it was installed.
          $p = Start-Process -FilePath "$env:SystemRoot\System32\cmd.exe" -ArgumentList "/c $envp `"$dir\Uninstall CropDog.exe`" /S" -Credential $cred -LoadUserProfile -Wait -PassThru -WorkingDirectory $T
          "uninstaller (as ${user}) cmd exit $($p.ExitCode)"
          Start-Sleep -Seconds 8
          foreach ($f in @($dir, "$home2\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\CropDog.lnk", "$home2\Desktop\CropDog.lnk")) {
            if (Test-Path -LiteralPath $f) { throw "left behind after uninstall (${user}): $f" }
          }
          $q = Start-Process -FilePath "$env:SystemRoot\System32\reg.exe" -ArgumentList @("query", "HKCU\$env:ARP") -Credential $cred -LoadUserProfile -Wait -PassThru -RedirectStandardOutput "$T\arp2.txt" -RedirectStandardError "$T\arp2.err" -WorkingDirectory $T
          if ($q.ExitCode -eq 0) { throw "the Add/Remove Programs entry was left behind for ${user}" }
          "uninstall (${user}): install folder, both shortcuts and the Add/Remove entry are gone" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

  # ── The automatic GPU -> processor fallback, forced (crop-dog 1.2.26+) ──────
  # The app's own ParserHost with the real runtimes and model: the machine is made
  # to choose the Intel GPU runtime, the GPU helper is made to fail ("start": dies
  # before ready; "first": dies on the first photo), and the host must switch to
  # the processor runtime — downloading it — parse all five photos, give boxes
  # identical to the Mac's, and remember the result. Photos as in box-check:
  # fetched from the private branch, never uploaded. Needs no build artifact.
  fallback-test:
    needs: build-app
    if: always() && (needs.build-app.result == 'success' || inputs.artifact_run != '')
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [start, first]
    steps:
      - name: Check out crop-dog
        uses: actions/checkout@v4
        with:
          repository: seenu-artona/crop-dog
          ref: ${{ inputs.ref || 'unified' }}
          ssh-key: ${{ secrets.CROPDOG_DEPLOY_KEY }}
          persist-credentials: false

      - name: Fetch the five standard photos (private branch, never uploaded)
        uses: actions/checkout@v4
        with:
          repository: seenu-artona/crop-dog
          ref: five-photos
          ssh-key: ${{ secrets.CROPDOG_DEPLOY_KEY }}
          persist-credentials: false
          path: photos

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (repo — run_crop3 needs sharp and the engine)
        run: npm ci

      - name: Forced GPU failure (${{ matrix.mode }}) -> processor, five photos, boxes vs the Mac
        shell: pwsh
        run: |
          node desktop/scripts/gpu-fallback-test.mjs photos "$env:RUNNER_TEMP\fb-${{ matrix.mode }}" ${{ matrix.mode }} 2>&1 | Tee-Object -Variable out
          $rc = $LASTEXITCODE
          "forced fallback (${{ matrix.mode }}):" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          ($out | Where-Object { $_ -match '^(ok  |FAIL|  log: GPU fallback|[0-9] identical|5E7A|forced fallback|FORCED)' }) | ForEach-Object { "    $_" } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Remove-Item -Recurse -Force photos -ErrorAction SilentlyContinue
          exit $rc

  # ── The five-photo box check: Windows CPU runtime vs the Mac ──────────────
  box-check:
    needs: build-app
    if: always() && (needs.build-app.result == 'success' || inputs.artifact_run != '')
    runs-on: windows-latest
    steps:
      - name: Check out crop-dog
        uses: actions/checkout@v4
        with:
          repository: seenu-artona/crop-dog
          ref: ${{ inputs.ref || 'unified' }}
          ssh-key: ${{ secrets.CROPDOG_DEPLOY_KEY }}
          persist-credentials: false

      # The five photos live on a PRIVATE branch of crop-dog, fetched with the same
      # read-only key. They stay on this runner's disk and nowhere else: no
      # artifact, no cache, no log line with pixels in it.
      - name: Fetch the five standard photos (private branch, never uploaded)
        uses: actions/checkout@v4
        with:
          repository: seenu-artona/crop-dog
          ref: five-photos
          ssh-key: ${{ secrets.CROPDOG_DEPLOY_KEY }}
          persist-credentials: false
          path: photos

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (repo — run_crop3 needs sharp and the engine)
        run: npm ci

      # The SAME runtime and model a Windows PC downloads (desktop/components.json
      # names them; sha256-checked as the app checks them). The cpu runtime is the
      # path a PC without a supported GPU runs — fp32 on the processor.
      - name: Fetch the Windows CPU runtime and the fp16 model from the releases repo
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $c = (Get-Content desktop/components.json | ConvertFrom-Json).win32
          $rt = $c.runtimes.cpu
          $rtf = $rt.files[0]
          New-Item -ItemType Directory -Force -Path dl, model | Out-Null
          gh release download $rt.release --repo seenu-artona/cropdog-releases --pattern $rtf.name --dir dl
          if ($LASTEXITCODE -ne 0) { throw "could not download the cpu runtime" }
          $got = (Get-FileHash -Algorithm SHA256 "dl/$($rtf.name)").Hash.ToLower()
          if ($got -ne $rtf.sha256) { throw "runtime sha256 $got != components.json $($rtf.sha256)" }
          foreach ($f in $c.model.files) {
            gh release download $c.model.release --repo seenu-artona/cropdog-releases --pattern $f.name --dir model
            if ($LASTEXITCODE -ne 0) { throw "could not download model file $($f.name)" }
            $h = (Get-FileHash -Algorithm SHA256 "model/$($f.name)").Hash.ToLower()
            if ($h -ne $f.sha256) { throw "model file $($f.name) sha256 $h != components.json $($f.sha256)" }
          }
          "runtime: $($rt.version)  model: $($c.model.version)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $root = Join-Path $env:RUNNER_TEMP "rt"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          tar -xzf "dl/$($rtf.name)" -C $root
          Remove-Item "dl/$($rtf.name)" -Force
          $py = Join-Path $root "runtime\python.exe"
          if (-not (Test-Path $py)) { throw "python.exe not found at $py after unpack" }
          "PY=$py" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Parse the five photos on the CPU runtime (fp32) and crop them with the app's engine
        shell: pwsh
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $names = Get-ChildItem photos -Filter *.JPG | ForEach-Object { $_.BaseName }
          "photos on disk: $($names.Count)"
          if ($names.Count -ne 5) { throw "expected the five standard photos, found $($names.Count)" }
          & $env:PY -I native/detect/cli.py --in photos --out maps --device cpu --precision fp32 --model model
          if ($LASTEXITCODE -ne 0) { throw "cli.py failed" }
          node native/detect/run_crop3.mjs --parts maps --out boxes-win.json
          if ($LASTEXITCODE -ne 0) { throw "run_crop3 failed" }

      - name: Compare with the Mac's boxes (only box numbers leave the runner)
        shell: pwsh
        run: |
          node native/detect/compare_boxes_json.mjs native/detect/golden/five-boxes-mac.json boxes-win.json 2>&1 | Tee-Object -Variable out
          $rc = $LASTEXITCODE
          "box check (Windows cpu fp32 vs Mac mps fp16):" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $out | ForEach-Object { "    $_" } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          # Belt and braces: the photos and maps must not be in anything that is
          # uploaded. This job uploads nothing; make that a checked fact.
          Remove-Item -Recurse -Force photos, maps
          exit $rc

  # ── The live cropping view's speed check (crop-dog 1.2.30+) ────────────────
  # The real, unpacked app crops the five photos x40 (200) per run, in a block of
  # five arms (desktop/scripts/live-timing.mjs): release (the shipped 1.2.29 —
  # the 400 px preview and the old popup), off, off again, plain (the photo, no
  # effects) and on (the full view); each arm a fresh start + a 5-photo warm-up.
  # One block per runner, three runners in parallel, each starting its rotation at
  # a different arm; every comparison is within one runner. No GPU here: the
  # processor path, the slow Windows case. Runner 1 also times Stop at the
  # lowered window priority. Signs in as a dedicated TEST member of CropDog Test
  # Studio with its password (secret CROPDOG_TEST_PASSWORD); no service key. The
  # photos stay on this runner: nothing is uploaded; only numbers reach the summary.
  live-timing:
    needs: build-app
    if: always() && inputs.live_timing && (needs.build-app.result == 'success' || inputs.artifact_run != '')
    runs-on: windows-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        include:
          - block: 1
            start: 0
            stops: 3
          - block: 2
            start: 2
            stops: 0
          - block: 3
            start: 4
            stops: 0
    steps:
      - name: Check out crop-dog (the harness and the app's public config)
        uses: actions/checkout@v4
        with:
          repository: seenu-artona/crop-dog
          ref: ${{ inputs.ref || 'unified' }}
          ssh-key: ${{ secrets.CROPDOG_DEPLOY_KEY }}
          persist-credentials: false

      - name: Fetch the five standard photos (private branch, never uploaded)
        uses: actions/checkout@v4
        with:
          repository: seenu-artona/crop-dog
          ref: five-photos
          ssh-key: ${{ secrets.CROPDOG_DEPLOY_KEY }}
          persist-credentials: false
          path: photos

      - name: Set up Node 22 (the harness uses the built-in WebSocket)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch this build (this run's artifact)
        if: inputs.artifact_run == ''
        uses: actions/download-artifact@v4
        with:
          name: CropDog-${{ inputs.version }}-win
          path: new

      - name: Fetch the build (an earlier run's artifact)
        if: inputs.artifact_run != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ inputs.artifact_run }} --repo ${{ github.repository }} -n CropDog-${{ inputs.version }}-win -D new

      - name: Fetch the release arm (the shipped 1.2.29 Windows build)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          gh release download desktop-v1.2.29-win --repo seenu-artona/cropdog-releases --pattern CropDog-1.2.29-win-x64.zip --dir rel
          if ($LASTEXITCODE -ne 0) { throw "could not download 1.2.29" }

      - name: Time the live view, block ${{ matrix.block }} (release / off / off2 / plain / on, 200 photos per run)
        shell: pwsh
        env:
          CROPDOG_TEST_EMAIL: ${{ vars.CROPDOG_TEST_EMAIL }}
          CROPDOG_TEST_PASSWORD: ${{ secrets.CROPDOG_TEST_PASSWORD }}
          CROPDOG_TEST_MACHINE_ID: "1ec0000000000001"   # the Mac harness's too: one test computer, no takeovers
          CROPDOG_TEST_DEVICE_NAME: "Live timing"
        run: |
          $ErrorActionPreference = "Stop"
          Expand-Archive -Path "new/CropDog-${{ inputs.version }}-win-x64.zip" -DestinationPath app -Force
          Expand-Archive -Path "rel/CropDog-1.2.29-win-x64.zip" -DestinationPath relapp -Force
          $exe = (Get-ChildItem -Path app -Recurse -Filter CropDog.exe | Select-Object -First 1).FullName
          $rel = (Get-ChildItem -Path relapp -Recurse -Filter CropDog.exe | Select-Object -First 1).FullName
          node desktop/scripts/live-timing.mjs --app $exe --release-app $rel --photos photos --repeat ${{ inputs.live_repeat || '40' }} --blocks 1 --block-start ${{ matrix.start }} --stop-trials ${{ matrix.stops }} --out live-timing.json 2>&1 | Tee-Object -Variable out
          $rc = $LASTEXITCODE
          Remove-Item -Recurse -Force photos -ErrorAction SilentlyContinue
          "live view timing, block ${{ matrix.block }} (Windows, processor, 200 photos per run):" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          ($out | Where-Object { $_ -match '(photos in|^.{9}block |MEANS|previews|STOP|stop [0-9]|NO PHOTO|WINDOW WAS HIDDEN|STEP FAILED|page:|timed out|Error)' }) | ForEach-Object { "    $_" } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          exit $rc
